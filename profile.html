{% extends 'base.html' %}{% block title %}Hồ sơ · StoryMap{% endblock %}{% block content %}<div class="profile-head"><div class="avatar">{{user['name'][0]|upper}}</div><div><h1>{{user['name']}}</h1><p class="muted">{{user['email']}}</p></div></div><div class="stats"><div><b>{{visited_count}}/63</b><span>Tỉnh đã đi</span></div><div><b>{{story_count}}</b><span>Stories</span></div><div><b>{{task_count}}</b><span>Task đang làm</span></div></div><div class="form-card"><h2>Chỉnh sửa hồ sơ</h2><form method="post"><input type="hidden" name="csrf" value="{{csrf_token()}}"><label>Tên hiển thị<input name="name" value="{{user['name']}}" required></label><label>Giới thiệu<textarea name="bio" rows="5">{{user['bio']}}</textarea></label><button class="btn primary">Lưu thay đổi</button></form></div>{% endblock %}

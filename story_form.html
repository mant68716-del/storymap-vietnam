{% extends 'base.html' %}{% block title %}Lưu Story · {{province['name']}}{% endblock %}{% block content %}<div class="form-card"><a href="{{url_for('index')}}">← Quay lại bản đồ</a><h1>📍 Lưu Story tại {{province['name']}}</h1><p class="muted">Story này sẽ tự đánh dấu <b>{{province['name']}}</b> là tỉnh đã đi.</p><form method="post" enctype="multipart/form-data"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="grid2"><label>Tiêu đề *<input name="title" required placeholder="Một ngày tuyệt vời ở..."></label><label>Ngày đi<input type="date" name="visit_date"></label></div><label>Địa điểm cụ thể<input name="location" placeholder="Ví dụ: Hồ Xuân Hương, Đà Lạt"></label><label>Nội dung Story *<textarea name="content" required rows="8" placeholder="Bạn đã thấy gì, cảm xúc thế nào..."></textarea></label><div class="grid2"><label>Vĩ độ (tuỳ chọn)<input name="latitude" type="number" step="any" placeholder="21.03"></label><label>Kinh độ (tuỳ chọn)<input name="longitude" type="number" step="any" placeholder="105.85"></label></div><label>Ảnh kỷ niệm<input type="file" name="image" accept="image/png,image/jpeg,image/webp,image/gif"></label><button class="btn primary" type="submit">💾 Lưu Story</button></form></div>{% endblock %}
